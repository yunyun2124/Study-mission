<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>임시 검증 · 보너스 버튼</title>
<style>
  body { margin: 0; padding: 12px; background: #101018; color: #eef; font-family: system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  h2 { font-size: 14px; margin: 18px 0 6px; color: #9fd; }
  pre { font-size: 13px; line-height: 1.5; white-space: pre-wrap; background: #1b1b28; padding: 10px; border-radius: 8px; }
  .frames { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; margin-top: 6px; }
  .box { background: #23233a; padding: 4px; border-radius: 8px; }
  .box p { margin: 2px 4px 6px; font-size: 12px; color: #cfd; }
  iframe { border: 0; background: #fff; display: block; }
</style>
</head>
<body>
<h1>임시 검증 · 보너스 버튼</h1>
<pre id="log">측정 중…</pre>

<h2>전체 화면 캡처용 (390px, 스크롤 없음)</h2>
<div class="frames" id="shots"></div>

<h2>폭 측정 · 동작 시험용</h2>
<div class="frames" id="frames"></div>

<script>
(function () {
  var BOARDS = [
    { name: "jaeyun", src: "./" },
    { name: "ayun", src: "./ayun/" }
  ];
  var WIDTHS = [390, 375, 360];
  var lines = [];

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function addFrame(parent, label, src, width, height) {
    var box = document.createElement("div");
    box.className = "box";
    var cap = document.createElement("p");
    cap.textContent = label;
    var f = document.createElement("iframe");
    f.width = width;
    f.height = height;
    f.scrolling = "no";
    f.src = src;
    f.setAttribute("title", label);
    box.appendChild(cap);
    box.appendChild(f);
    parent.appendChild(box);
    return new Promise(function (resolve) {
      f.addEventListener("load", function () { resolve(f); }, { once: true });
    });
  }

  function measure(f) {
    var d = f.contentDocument;
    var de = d.documentElement;
    var actions = d.querySelector(".board-actions");
    var btns = Array.prototype.map.call(d.querySelectorAll(".board-actions button"), function (b) {
      var r = b.getBoundingClientRect();
      return {
        label: b.textContent.trim(),
        l: Math.round(r.left), r: Math.round(r.right), w: Math.round(r.width), top: Math.round(r.top)
      };
    });
    return {
      scrollW: de.scrollWidth,
      clientW: de.clientWidth,
      bodyScrollW: d.body.scrollWidth,
      actionsW: actions ? Math.round(actions.getBoundingClientRect().width) : -1,
      sameLine: btns.length > 1 ? btns[0].top === btns[1].top : null,
      nearEdge: btns.length ? Math.min.apply(null, btns.map(function (b) { return b.l; })) : -1,
      buttons: btns
    };
  }

  async function run() {
    var shots = document.getElementById("shots");
    for (var s = 0; s < BOARDS.length; s++) {
      await addFrame(shots, BOARDS[s].name + " · 390px 전체", BOARDS[s].src, 390, 2300);
    }
    await wait(1200);

    var frames = document.getElementById("frames");
    for (var i = 0; i < BOARDS.length; i++) {
      for (var j = 0; j < WIDTHS.length; j++) {
        var f = await addFrame(frames, BOARDS[i].name + " · " + WIDTHS[j] + "px", BOARDS[i].src, WIDTHS[j], 820);
        await wait(650);
        var m = measure(f);
        lines.push(
          BOARDS[i].name + " " + WIDTHS[j] + "px → scrollW " + m.scrollW + " / clientW " + m.clientW +
          " / bodyScrollW " + m.bodyScrollW + " / overflow " + (m.scrollW - m.clientW) +
          "\n   actionsW " + m.actionsW + " / sameLine " + m.sameLine + "\n   buttons: " +
          m.buttons.map(function (b) { return b.label + " [" + b.l + "–" + b.r + "] w" + b.w + " top" + b.top; }).join("  ")
        );
        document.getElementById("log").textContent = lines.join("\n");
      }
    }
    document.getElementById("log").textContent += "\n\nDONE";
  }

  run();
})();
</script>
</body>
</html>
