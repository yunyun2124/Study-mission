<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>임시 검증 · 티니핑 스티커</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet" />
<style>
  body { margin:0; background:#f3eef7; font-family:"Noto Sans KR", system-ui, sans-serif; }
  .set {
    width:640px; margin:0; padding:22px 24px 26px; box-sizing:border-box;
    background:linear-gradient(180deg,#fff8fc,#ffeef7);
  }
  .set h1 { font-family:"Jua", sans-serif; font-size:26px; color:#c62a7e; margin:0 0 16px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px 10px; }
  .item { text-align:center; }
  .item img { width:96px; height:96px; border-radius:50%; background:#fff;
    border:3px solid #fff; box-shadow:0 4px 10px rgba(198,102,155,.22); }
  .item span { display:block; margin-top:6px; font-family:"Jua", sans-serif; font-size:16px; color:#5b2b47; }
  .boardwrap { padding:16px 20px 24px; }
  iframe { border:0; display:block; background:#fff; box-shadow:0 8px 22px rgba(120,60,110,.18); border-radius:18px; }
</style>
</head>
<body>
<section class="set" id="set">
  <h1>🎀 티니핑 스티커 10종</h1>
  <div class="grid">
    <div class="item"><img src="ayun/stickers/hachuping.webp" alt="하츄핑"><span>하츄핑</span></div>
    <div class="item"><img src="ayun/stickers/banggeulping.webp" alt="방글핑"><span>방글핑</span></div>
    <div class="item"><img src="ayun/stickers/mideoping.webp" alt="믿어핑"><span>믿어핑</span></div>
    <div class="item"><img src="ayun/stickers/joahping.webp" alt="조아핑"><span>조아핑</span></div>
    <div class="item"><img src="ayun/stickers/chachaping.webp" alt="차차핑"><span>차차핑</span></div>
    <div class="item"><img src="ayun/stickers/lalaping.webp" alt="라라핑"><span>라라핑</span></div>
    <div class="item"><img src="ayun/stickers/shashaping.webp" alt="샤샤핑"><span>샤샤핑</span></div>
    <div class="item"><img src="ayun/stickers/mallangping.webp" alt="말랑핑"><span>말랑핑</span></div>
    <div class="item"><img src="ayun/stickers/chorongping.webp" alt="초롱핑"><span>초롱핑</span></div>
    <div class="item"><img src="ayun/stickers/nanaping.webp" alt="나나핑"><span>나나핑</span></div>
  </div>
</section>
<div class="boardwrap">
  <iframe id="f390" src="ayun/#board" width="390" height="1150" title="390px board"></iframe>
</div>
</body>
</html>
