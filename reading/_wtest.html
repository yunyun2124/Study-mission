<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>폭 검사 (임시)</title>
<style>
  body{margin:0;background:#2b2621;font-family:system-ui,sans-serif;color:#fff}
  h1{font-size:14px;padding:10px 14px;margin:0}
  pre{background:#111;color:#8ff;font-size:12px;padding:10px 14px;margin:0;white-space:pre-wrap}
  .row{display:flex;gap:14px;padding:14px;align-items:flex-start}
  iframe{border:0;background:#fbf4e8;flex:0 0 auto}
</style>
</head>
<body>
<h1>독서 기록장 · 모바일 폭 검사 (임시 페이지, 배포 후 삭제)</h1>
<pre id="out">측정 중…</pre>
<div class="row">
  <iframe id="f390" src="./?w=11" width="390" height="844" title="390"></iframe>
  <iframe id="f375" src="./?w=12" width="375" height="844" title="375"></iframe>
  <iframe id="f360" src="./?w=13" width="360" height="844" title="360"></iframe>
</div>
<script>
(function(){
  var out = document.getElementById("out");
  var lines = [];

  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function overflowReport(win, doc, label){
    var vw = win.innerWidth;
    var sw = Math.max(doc.documentElement.scrollWidth, doc.body.scrollWidth);
    var bad = [];
    var all = doc.querySelectorAll("body *");
    for (var i = 0; i < all.length; i++){
      var el = all[i];
      var r = el.getBoundingClientRect();
      if (r.width > 0 && r.right > vw + 0.5 && getComputedStyle(el).position !== "fixed"){
        bad.push(el.tagName.toLowerCase() + "." + (el.className && el.className.toString().split(" ")[0] || "") + "→" + Math.round(r.right));
      }
      if (bad.length > 4) break;
    }
    var ok = sw <= vw;
    lines.push(label + " · innerWidth=" + vw + " scrollWidth=" + sw + " " + (ok ? "OK" : "OVERFLOW") + (bad.length ? " | " + bad.join(", ") : ""));
    return ok;
  }

  function measureState(frame, w, stateName){
    var win = frame.contentWindow, doc = frame.contentDocument;
    overflowReport(win, doc, "[" + w + "] " + stateName);
  }

  async function run(){
    var frame = document.getElementById("f390");
    var win, doc;

    // 390 에서 상태별 검사
    win = frame.contentWindow; doc = frame.contentDocument;
    await wait(400);
    measureState(frame, 390, "책장(기본)");

    var card = doc.querySelector(".book-card");
    if (card){
      card.click(); await wait(250);
      measureState(frame, 390, "책 상세");

      var addLog = doc.getElementById("btnAddLog");
      if (addLog){
        addLog.click(); await wait(300);
        measureState(frame, 390, "기록 시트");
        var seg = doc.getElementById("logModeSeg");
        var rng = seg && seg.querySelector('[data-mode="range"]');
        if (rng){ rng.click(); await wait(200); measureState(frame, 390, "기록 시트(범위)"); }
        var cur = seg && seg.querySelector('[data-mode="current"]');
        if (cur){ cur.click(); await wait(200); measureState(frame, 390, "기록 시트(현재쪽)"); }
        var bd = doc.querySelector("#logSheet .sheet-backdrop");
        if (bd) bd.click(); await wait(200);
      }

      var memo = doc.getElementById("bookMemo");
      if (memo){ memo.value = ""; measureState(frame, 390, "책 상세(메모)"); }

      var edit = doc.getElementById("btnEditBook");
      if (edit){ edit.click(); await wait(300); measureState(frame, 390, "책 수정 시트"); }
      var bd2 = doc.querySelector("#bookSheet .sheet-backdrop");
      if (bd2) bd2.click(); await wait(200);

      var back = doc.getElementById("btnBack");
      if (back){ back.click(); await wait(300); }
    }

    // 설정 시트
    var st = doc.getElementById("btnSettings");
    if (st){ st.click(); await wait(300); measureState(frame, 390, "설정 시트"); var bd3 = doc.querySelector("#settingsSheet .sheet-backdrop"); if (bd3) bd3.click(); await wait(200); }

    // 각 폭에서 책장 + 시트 검사
    var frames = [["f375",375],["f360",360]];
    for (var i = 0; i < frames.length; i++){
      var fr = document.getElementById(frames[i][0]);
      var w = frames[i][1];
      var d = fr.contentDocument;
      await wait(300);
      measureState(fr, w, "책장(기본)");
      var c2 = d.querySelector(".book-card");
      if (c2){ c2.click(); await wait(250); measureState(fr, w, "책 상세"); }
      var al = d.getElementById("btnAddLog");
      if (al){ al.click(); await wait(300); measureState(fr, w, "기록 시트");
        var sg = d.getElementById("logModeSeg");
        var rg = sg && sg.querySelector('[data-mode="range"]');
        if (rg){ rg.click(); await wait(200); measureState(fr, w, "기록 시트(범위)"); }
        var cn = sg && sg.querySelector('[data-mode="current"]');
        if (cn){ cn.click(); await wait(200); measureState(fr, w, "기록 시트(현재쪽)"); }
        var bk = d.querySelector("#logSheet .sheet-backdrop"); if (bk) bk.click(); await wait(200);
      }
      var ed = d.getElementById("btnEditBook");
      if (ed){ ed.click(); await wait(250); measureState(fr, w, "책 수정 시트"); var bk2 = d.querySelector("#bookSheet .sheet-backdrop"); if (bk2) bk2.click(); await wait(200); }
      var st2 = d.getElementById("btnSettings");
      if (st2){ st2.click(); await wait(250); measureState(fr, w, "설정 시트"); var bk3 = d.querySelector("#settingsSheet .sheet-backdrop"); if (bk3) bk3.click(); await wait(150); }
    }

    out.textContent = lines.join("\n") + "\n\n총 " + lines.length + "개 상태 검사 완료";
    document.title = "DONE " + (lines.filter(function(l){ return l.indexOf("OVERFLOW") >= 0; }).length) + " overflow";
  }

  window.addEventListener("load", function(){ setTimeout(run, 600); });
})();
</script>
</body>
</html>
